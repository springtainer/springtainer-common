# Bounds Spring's test-context cache so a no-longer-current context (and, via its ContextClosedEvent listener, its
# embedded container) gets evicted and cleanly closed as soon as a differently-configured context needs the slot,
# instead of piling up unclosed until the whole JVM exits.
#
# Read via org.springframework.core.SpringProperties, which resolves this classpath resource regardless of how the
# test JVM was launched (Maven Surefire/Failsafe or an IDE's own test runner) - unlike a plugin-scoped
# systemPropertyVariable, which only applies when Maven itself starts the JVM.
spring.test.context.cache.maxSize=1
